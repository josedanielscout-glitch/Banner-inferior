<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banner Pastoral Final</title>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Colors */
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-400: #9ca3af;
            --gray-700: #374151;
            
            --blue-50: #eff6ff;
            --blue-200: #bfdbfe;
            --blue-500: #3b82f6;
            --blue-600: #2563eb;
            
            --indigo-50: #eef2ff;
            --indigo-500: #6366f1;
            --indigo-600: #4f46e5;
            
            --pink-50: #fdf2f8;
            --pink-200: #fbcfe8;
            --pink-500: #ec4899;
            --pink-600: #db2777;
            
            --orange-50: #fff7ed;
            --orange-500: #f97316;
            --orange-600: #ea580c;
            
            --green-50: #f0fdf4;
            --green-400: #4ade80;
            --green-500: #22c55e;
            --green-600: #16a34a;
            
            --teal-50: #f0fdfa;
            --teal-500: #14b8a6;
            --teal-600: #0d9488;
            
            --red-50: #fef2f2;
            --red-200: #fecaca;
            --red-500: #ef4444;
            --red-600: #dc2626;
            
            --yellow-50: #fefce8;
            --yellow-500: #eab308;
            --yellow-600: #ca8a04;

            /* Social Brand Colors */
            --facebook: #1877F2;
            --youtube: #FF0000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #f0f2f5;
        }
        
        a {
            text-decoration: none;
            color: inherit;
        }

        /* --- Utilities & Layout --- */
        .relative { position: relative; }
        .absolute { position: absolute; }
        .inset-0 { top: 0; right: 0; bottom: 0; left: 0; }
        .z-10 { z-index: 10; }
        .z-20 { z-index: 20; }
        .w-full { width: 100%; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-center { justify-content: center; }
        .justify-between { justify-content: space-between; }
        .gap-2 { gap: 0.5rem; }
        .gap-3 { gap: 0.75rem; }
        .gap-4 { gap: 1rem; }
        .gap-6 { gap: 1.5rem; }
        .px-2 { padding-left: 0.5rem; padding-right: 0.5rem; }
        .px-4 { padding-left: 1rem; padding-right: 1rem; }
        .pt-3 { padding-top: 0.75rem; }
        .pt-6 { padding-top: 1.5rem; }
        .pb-6 { padding-bottom: 1.5rem; }
        .mb-3 { margin-bottom: 0.75rem; }
        .mt-5 { margin-top: 1.25rem; }
        .mx-auto { margin-left: auto; margin-right: auto; }
        
        .max-w-7xl {
            max-width: 80rem;
        }

        /* --- Typography --- */
        .text-xs { font-size: 0.75rem; line-height: 1rem; }
        .text-sm { font-size: 0.875rem; line-height: 1.25rem; }
        .text-lg { font-size: 1.125rem; line-height: 1.75rem; }
        .text-\[10px\] { font-size: 10px; }
        .text-\[11px\] { font-size: 11px; }
        .font-medium { font-weight: 500; }
        .font-bold { font-weight: 700; }
        .italic { font-style: italic; }
        .uppercase { text-transform: uppercase; }
        .tracking-wide { letter-spacing: 0.025em; }
        .tracking-widest { letter-spacing: 0.1em; }
        .text-center { text-align: center; }

        .text-white { color: #fff; }
        .text-gray-400 { color: var(--gray-400); }
        .text-gray-700 { color: var(--gray-700); }

        /* --- Visual Effects --- */
        .opacity-0 { opacity: 0; }
        .opacity-60 { opacity: 0.6; }
        .opacity-100 { opacity: 1; }
        
        .shadow-sm { box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); }
        .shadow-inner { box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.06); }
        
        .border-t { border-top-width: 1px; border-top-style: solid; }
        .border-gray-100 { border-color: var(--gray-100); }
        .border-gray-200\/50 { border-color: rgba(229, 231, 235, 0.5); }
        .border-white\/50 { border-color: rgba(255, 255, 255, 0.5); }

        .rounded-full { border-radius: 9999px; }
        .rounded-xl { border-radius: 0.75rem; }
        .rounded-2xl { border-radius: 1rem; }

        .overflow-hidden { overflow: hidden; }
        .transform { transform: translate(var(--tw-translate-x, 0), var(--tw-translate-y, 0)) rotate(var(--tw-rotate, 0)) skewX(var(--tw-skew-x, 0)) skewY(var(--tw-skew-y, 0)) scaleX(var(--tw-scale-x, 1)) scaleY(var(--tw-scale-y, 1)); }
        
        .transition-all { transition-property: all; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
        .transition-opacity { transition-property: opacity; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
        .transition-colors { transition-property: color, background-color, border-color, text-decoration-color, fill, stroke; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
        .duration-300 { transition-duration: 300ms; }

        /* --- Custom Components --- */
        .footer-bg {
            background: radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                        radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                        radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            background-color: #ffffff;
            background-image: 
                radial-gradient(at 80% 0%, hsla(189,100%,56%,0.1) 0px, transparent 50%),
                radial-gradient(at 0% 50%, hsla(355,100%,93%,1) 0px, transparent 50%),
                radial-gradient(at 80% 50%, hsla(340,100%,76%,0.1) 0px, transparent 50%),
                radial-gradient(at 0% 100%, hsla(22,100%,77%,0.1) 0px, transparent 50%),
                radial-gradient(at 80% 100%, hsla(242,100%,70%,0.1) 0px, transparent 50%),
                radial-gradient(at 0% 0%, hsla(343,100%,76%,0.1) 0px, transparent 50%);
            background-size: 200% 200%;
            animation: mesh-move 15s ease infinite alternate;
            box-shadow: 0 -10px 40px -15px rgba(0,0,0,0.05);
        }

        @keyframes mesh-move {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }
        
        .pulse-dot {
            width: 0.5rem;
            height: 0.5rem;
            border-radius: 9999px;
            background-color: var(--green-400);
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.75rem;
        }

        /* --- Tarjetas "Prismáticas" --- */
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -1px rgba(0, 0, 0, 0.02);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            z-index: 1;
            padding: 0.625rem; /* p-2.5 */
            border-radius: 1rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            cursor: pointer;
        }

        .glass-card::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 2px;
            background: linear-gradient(45deg, var(--color-start), var(--color-end));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-4px) scale(1.02);
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 10px 25px -5px rgba(var(--shadow-rgb), 0.15), 0 8px 10px -6px rgba(var(--shadow-rgb), 0.1);
        }

        .glass-card:hover::before { opacity: 1; }
        .glass-card:hover i { animation: bounce-rotate 0.6s ease; }

        @keyframes bounce-rotate {
            0% { transform: scale(1); }
            50% { transform: scale(1.2) rotate(10deg); }
            100% { transform: scale(1) rotate(0deg); }
        }
        
        .card-icon-container {
            width: 2.25rem;
            height: 2.25rem;
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.06);
            transition: color 300ms cubic-bezier(0.4, 0, 0.2, 1), background-color 300ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Specific Card Colors */
        .card-1 .card-icon-container { background-color: var(--blue-50); color: var(--blue-500); }
        .card-1:hover .card-icon-container { background-color: var(--blue-500); color: white; }
        .card-1:hover .card-text { color: var(--blue-600); }

        .card-2 .card-icon-container { background-color: var(--indigo-50); color: var(--indigo-500); }
        .card-2:hover .card-icon-container { background-color: var(--indigo-500); color: white; }
        .card-2:hover .card-text { color: var(--indigo-600); }

        .card-3 .card-icon-container { background-color: var(--pink-50); color: var(--pink-500); }
        .card-3:hover .card-icon-container { background-color: var(--pink-500); color: white; }
        .card-3:hover .card-text { color: var(--pink-600); }

        .card-4 .card-icon-container { background-color: var(--orange-50); color: var(--orange-500); }
        .card-4:hover .card-icon-container { background-color: var(--orange-500); color: white; }
        .card-4:hover .card-text { color: var(--orange-600); }

        .card-5 .card-icon-container { background-color: var(--green-50); color: var(--green-500); }
        .card-5:hover .card-icon-container { background-color: var(--green-500); color: white; }
        .card-5:hover .card-text { color: var(--green-600); }

        .card-6 .card-icon-container { background-color: var(--teal-50); color: var(--teal-500); }
        .card-6:hover .card-icon-container { background-color: var(--teal-500); color: white; }
        .card-6:hover .card-text { color: var(--teal-600); }

        .card-7 .card-icon-container { background-color: var(--red-50); color: var(--red-500); }
        .card-7:hover .card-icon-container { background-color: var(--red-500); color: white; }
        .card-7:hover .card-text { color: var(--red-600); }

        .card-8 .card-icon-container { background-color: var(--yellow-50); color: var(--yellow-600); }
        .card-8:hover .card-icon-container { background-color: var(--yellow-500); color: white; }
        .card-8:hover .card-text { color: var(--yellow-600); }

        .card-text {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--gray-700);
            transition: color 300ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* --- Social Links --- */
        .social-link {
            position: relative;
            width: 2.75rem;
            height: 2.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 9999px;
            background-color: white;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            border: 1px solid var(--gray-100);
            overflow: hidden;
            transition: all 300ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        .social-link:hover {
            transform: translateY(-0.25rem);
        }

        .social-link .hover-bg {
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 300ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        .social-link:hover .hover-bg { opacity: 1; }
        .social-link:hover i { color: white; }
        
        .social-icon {
            position: relative;
            z-index: 10;
            font-size: 1.125rem;
            transition: color 300ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Social Specific Styles */
        .social-web { color: var(--blue-500); }
        .social-web:hover { box-shadow: 0 10px 15px -3px rgba(191, 219, 254, 0.5), 0 4px 6px -2px rgba(191, 219, 254, 0.5); }
        .social-web .hover-bg { background-color: var(--blue-500); }

        .social-fb { color: var(--facebook); }
        .social-fb:hover { box-shadow: 0 10px 15px -3px rgba(191, 219, 254, 0.5), 0 4px 6px -2px rgba(191, 219, 254, 0.5); }
        .social-fb .hover-bg { background-color: var(--facebook); }

        .social-ig { color: #E4405F; }
        .social-ig:hover { box-shadow: 0 10px 15px -3px rgba(251, 207, 232, 0.5), 0 4px 6px -2px rgba(251, 207, 232, 0.5); }
        .social-ig .hover-bg { background: linear-gradient(to top right, #f09433, #dc2743, #bc1888); }

        .social-yt { color: var(--youtube); }
        .social-yt:hover { box-shadow: 0 10px 15px -3px rgba(254, 202, 202, 0.5), 0 4px 6px -2px rgba(254, 202, 202, 0.5); }
        .social-yt .hover-bg { background-color: var(--youtube); }

        /* --- Responsive Design --- */
        .hidden-sm { display: none; }
        
        @media (min-width: 640px) { /* sm */
            .hidden-sm { display: block; }
            .grid-container { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        }

        @media (min-width: 1024px) { /* lg */
            .lg-px-8 { padding-left: 2rem; padding-right: 2rem; }
            .lg-flex-row { flex-direction: row; }
            .lg-gap-8 { gap: 2rem; }
            .lg-w-auto { width: auto; }
            .lg-mr-4 { margin-right: 1rem; }
            .lg-flex-col { flex-direction: column; }
            .lg-flex-1 { flex: 1 1 0%; }
        }
    </style>
</head>
